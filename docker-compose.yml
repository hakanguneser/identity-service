services:
  identity:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GITHUB_ACTOR: ${GITHUB_ACTOR}
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    image: identity:latest
    container_name: identity
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SERVER_PORT}:${SERVER_PORT}"
    environment:
      TZ: Europe/Istanbul

      # Spring
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: ${SERVER_PORT}

      # Database
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL}

      # Security — EC P-256 asymmetric key pair (Base64 PKCS8/X509)
      EC_PRIVATE_KEY: ${EC_PRIVATE_KEY:?EC_PRIVATE_KEY is required}
      EC_PUBLIC_KEY: ${EC_PUBLIC_KEY:?EC_PUBLIC_KEY is required}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      JWT_TOKEN_VALIDITY_IN_MINUTES: ${JWT_TOKEN_VALIDITY_IN_MINUTES}
      JWT_REFRESH_TOKEN_VALIDITY_IN_DAYS: ${JWT_REFRESH_TOKEN_VALIDITY_IN_DAYS}

      # System tokens (inter-service auth)
      TRACKER_TOKEN: ${TRACKER_TOKEN:?TRACKER_TOKEN is required}

      # Mail
      MAIL_ENABLED: ${MAIL_ENABLED}
      MAIL_LOG_ENABLED: ${MAIL_LOG_ENABLED}
      MAIL_REDIRECT_ENABLED: ${MAIL_REDIRECT_ENABLED}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_ADMIN_MAIL: ${MAIL_ADMIN_MAIL}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      # Expo push notifications
      EXPO_PUSH_BASE_URL: ${EXPO_PUSH_BASE_URL}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN}

    networks:
      - network_infra

networks:
  network_infra:
    external: true
