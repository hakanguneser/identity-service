services:
  identity:
    build:
      context: .
      dockerfile: Dockerfile
    image: identity:latest
    container_name: identity
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SERVER_PORT}:${SERVER_PORT}"
      - "127.0.0.1:17102:17102"
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:17102"
      TZ: Europe/Istanbul

      # Spring
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: ${SERVER_PORT}

      # Database
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL}

      # Security — EC P-256 asymmetric key pair (Base64 PKCS8/X509)
      EC_PRIVATE_KEY: ${EC_PRIVATE_KEY}
      EC_PUBLIC_KEY: ${EC_PUBLIC_KEY}
      JWT_TOKEN_VALIDITY_IN_MINUTES: ${JWT_TOKEN_VALIDITY_IN_MINUTES}
      JWT_REFRESH_TOKEN_VALIDITY_IN_DAYS: ${JWT_REFRESH_TOKEN_VALIDITY_IN_DAYS}

      # System tokens (inter-service auth)
      TRACKER_TOKEN: ${TRACKER_TOKEN}
      FORMFLOW_TOKEN: ${FORMFLOW_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}

      # App
      APP_ADMIN_REGISTRATION_ENABLED: ${APP_ADMIN_REGISTRATION_ENABLED}

      # Mail
      MAIL_ENABLED: ${MAIL_ENABLED}
      MAIL_LOG_ENABLED: ${MAIL_LOG_ENABLED}
      MAIL_REDIRECT_ENABLED: ${MAIL_REDIRECT_ENABLED}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_ADMIN_MAIL: ${MAIL_ADMIN_MAIL}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      # Expo push notifications
      EXPO_PUSH_BASE_URL: ${EXPO_PUSH_BASE_URL}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN}

    networks:
      - network_infra

networks:
  network_infra:
    external: true
