spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:identity}
    username: ${DATABASE_USERNAME:identity_admin}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      connection-init-sql: SET TIMEZONE TO 'Europe/Istanbul'
      pool-name: identity-hikari
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      # Shared Postgres (max_connections 100): keep pools small, deploy overlap doubles them.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      auto-commit: false
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 5000
      connection-test-query: SELECT 1

  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: update

server:
  port: ${SERVER_PORT:7102}


management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics


app:
  admin:
    registration:
      enabled: ${APP_ADMIN_REGISTRATION_ENABLED:true}
  expo:
    base-url: ${EXPO_PUSH_BASE_URL:https://exp.host}
    access-token: ${EXPO_ACCESS_TOKEN:}



gastroblue:
  product: IDENTITY
  identity:
    token:
      private-key: ${EC_PRIVATE_KEY}
  commons:
    mail:
      enabled: ${MAIL_ENABLED:true}
      log-enabled: ${MAIL_LOG_ENABLED:true}
      redirect-enabled: ${MAIL_REDIRECT_ENABLED:false}
      from: ${MAIL_FROM:noreply@gastroblueapp.com}
      admin-mail: ${MAIL_ADMIN_MAIL:}
      smtp:
        username: ${MAIL_SMTP_USERNAME:${MAIL_FROM:noreply@gastroblueapp.com}}
        password: ${MAIL_PASSWORD:}
    security:
      enabled: true
      public-key: ${EC_PUBLIC_KEY}
      token-validity-in-minutes: ${JWT_TOKEN_VALIDITY_IN_MINUTES:60}
      refresh-token-validity-in-days: ${JWT_REFRESH_TOKEN_VALIDITY_IN_DAYS:7}
      # Only tracker-service calls identity with a sys token (/api/v1/tracker/**). No default on purpose.
      sys-tokens:
        tracker:
          token: ${TRACKER_TOKEN}
          product: TRACKER
    tracing:
      enabled: true
    exception:
      enabled: true
      cache: true
    swagger:
      enabled: ${SWAGGER_ENABLED:false}
      title: Identity Service API
      version: 1.0
      description: GastroBlue kimlik doğrulama servisi
      contact:
        name: Hakan Guneser
        email: hakanguneser@gastroblueapp.com
        url: https://www.gastroblue.com/
    lookup:
      cache: true